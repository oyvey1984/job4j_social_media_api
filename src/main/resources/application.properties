spring.application.name=job4j_social_media_api

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/social_media?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/dbchangelog.xml

# \u041B\u043E\u0433\u0438 DataSource
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG

# \u041F\u043E\u043A\u0430\u0437 SQL \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u043F\u0440\u0438 \u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u0438
spring.liquibase.show-summary-output=all

# \u0414\u0435\u0442\u0430\u043B\u044C\u043D\u043E\u0435 \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0434\u043B\u044F Liquibase
logging.level.liquibase=TRACE
logging.level.liquibase.core=TRACE
logging.level.liquibase.changelog=TRACE
logging.level.liquibase.resource=TRACE
logging.level.liquibase.parser=TRACE

# \u041B\u043E\u0433\u0438 Spring Boot \u0434\u043B\u044F Liquibase
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

# \u0414\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0434\u043B\u044F \u043E\u0442\u043B\u0430\u0434\u043A\u0438
debug=true

# \u041A\u043E\u0434\u0438\u0440\u043E\u0432\u043A\u0430 \u0434\u043B\u044F \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0439 \u0432\u0430\u043B\u0438\u0434\u0430\u0446\u0438\u0438
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# \u041A\u043E\u0434\u0438\u0440\u043E\u0432\u043A\u0430 \u0434\u043B\u044F \u043E\u0442\u0432\u0435\u0442\u043E\u0432
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# \u041A\u043E\u0434\u0438\u0440\u043E\u0432\u043A\u0430 \u0434\u043B\u044F \u043B\u043E\u0433\u043E\u0432
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# API
socialmedia.openapi.dev-url=http://localhost:8080
socialmedia.openapi.prod-url=https://mydomen.com

# \u0422\u0435\u0441\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 API
springdoc.swagger-ui.tryItOutEnabled=true

